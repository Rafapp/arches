# Hardware description for arches-v2, read at startup (no rebuild needed).
# Pick another file with --hardware=<path>. Any key can also be given on the
# command line as --key=value, which takes priority over this file.
#
# A comma separated list sweeps that parameter: the simulation runs once per
# combination of all swept parameters and writes out-<run>.png for each.
#   num-tms = 1,2,4,8,16,32,64

# RTX 2080 (Turing)
core-clock-mhz = 1515
dram-clock-mhz = 3500
num-tms = 46
num-tps = 64
num-threads = 8
stack-size = 1024
max-rays = 64

# DRAM (dram-config is a file in units/ramulator/config-files)
num-partitions = 8
dram-config = gddr6_14000_config.yaml
dram-latency = 92

# L2$
l2-size-kb = 512
l2-associativity = 16
l2-slices = 4
l2-mshr = 192
l2-subentries = 4
l2-latency = 160

# L1d$
l1d-size-kb = 64
l1d-associativity = 32
l1d-banks = 16
l1d-mshr = 256
l1d-subentries = 16
l1d-latency = 20
